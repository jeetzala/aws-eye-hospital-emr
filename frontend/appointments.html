<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointments Management</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
}

.header{
    background:#0B6E99;
    color:white;
    text-align:center;
    padding:20px;
}

.header h1{
    color:white;
    margin:0;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

.back-btn{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 18px;
    background:#0B6E99;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

th{
    background:#0B6E99;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f8f8f8;
}

.status-scheduled{
    color:#2BB673;
    font-weight:bold;
}

.status-pending{
    color:#ff9800;
    font-weight:bold;
}

.status-completed{
    color:#0B6E99;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="header">
    <h1>📅 Appointment Management</h1>
</div>

<div class="container">

<a href="dashboard.html" class="back-btn">
← Back to Dashboard
</a>

<table>

<thead>
<tr>
<th>Appointment ID</th>
<th>Patient</th>
<th>Doctor</th>
<th>Date</th>
<th>Status</th>
</tr>
</thead>

<tbody>

<tr>
<td>A001</td>
<td>John Smith</td>
<td>Dr. Brown</td>
<td>2026-06-05</td>
<td class="status-scheduled">Scheduled</td>
</tr>

<tr>
<td>A002</td>
<td>Sarah Lee</td>
<td>Dr. Wilson</td>
<td>2026-06-06</td>
<td class="status-pending">Pending</td>
</tr>

<tr>
<td>A003</td>
<td>Robert Davis</td>
<td>Dr. Brown</td>
<td>2026-06-07</td>
<td class="status-completed">Completed</td>
</tr>

</tbody>

</table>

</div>

</body>
</html>
